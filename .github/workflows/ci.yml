name: CI Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    uses: ./.github/workflows/reusable-test.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
