name: Reusable Python Tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ inputs.os }} / Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Composite Action
        uses: ./.github/actions/python-check
        with:
          python-version: ${{ inputs.python-version }}
