name: Python Quality Check
description: Install dependencies, lint and test

inputs:
  python-version:
    description: Python version
    required: true

runs:
  using: composite
  steps:

    - name: Install dependencies (timed)
      shell: bash
      run: |
        python - <<'PY'
        import os
        import subprocess
        import sys
        import time

        start = time.perf_counter()

        subprocess.run(
            [sys.executable, "-m", "pip", "install",
             "-r", "requirements.txt"],
            check=True
        )

        elapsed = time.perf_counter() - start

        print(f"Installation time: {elapsed:.2f} seconds")

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("### Cache OFF - Baseline\n")
            f.write(f"Install time: {elapsed:.2f} seconds\n")
        PY

    - name: Run lint
      shell: bash
      run: python -m ruff check .

    - name: Run tests
      shell: bash
      run: python -m pytest -v
